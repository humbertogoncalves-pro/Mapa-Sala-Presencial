<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Salas - Anhanguera Valinhos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center py-8 px-4">
    <div class="w-full max-w-7xl bg-white rounded-xl shadow-lg overflow-hidden flex flex-col h-[85vh]">
        <div class="bg-orange-500 text-white p-6 rounded-t-xl shrink-0">
            <h1 class="text-2xl font-bold text-center">Anhanguera Valinhos</h1>
            <p class="text-center text-orange-100 mt-1">Mapa de Salas - Presencial</p>
        </div>
        <div class="p-6 border-b border-gray-200 bg-gray-50 shrink-0">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative">
                    <label for="searchInput" class="block text-sm font-medium text-gray-700 mb-1">Buscar (Aba, Curso, Disciplina ou Sala):</label>
                    <input type="text" id="searchInput" placeholder="Ex: Engenharia, Sala B-40..." 
                           class="w-full pl-4 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-shadow">
                </div>
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label for="dayFilter" class="block text-sm font-medium text-gray-700 mb-1">Dia da Semana:</label>
                        <select id="dayFilter" class="w-full pl-3 pr-8 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none bg-white">
                            <option value="">Todos os dias</option>
                            <option value="Seg">Segunda-feira (Seg)</option>
                            <option value="Ter">Terça-feira (Ter)</option>
                            <option value="Qua">Quarta-feira (Qua)</option>
                            <option value="Qui">Quinta-feira (Qui)</option>
                            <option value="Sex">Sexta-feira (Sex)</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="mt-4 text-sm text-gray-500 flex justify-between items-center">
                <span id="resultCount">Carregando salas...</span>
                <button id="clearFiltersBtn" class="text-orange-600 hover:text-orange-800 font-medium hidden">Limpar Filtros</button>
            </div>
        </div>
        <div class="flex-1 overflow-auto bg-white p-0 relative">
            <table class="w-full text-left border-collapse min-w-max">
                <thead class="sticky top-0 bg-gray-100 z-10 shadow-sm">
                    <tr>
                        <th class="py-3 px-4 font-semibold text-gray-600 border-b border-gray-200">Aba</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 border-b border-gray-200">Curso</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 border-b border-gray-200 w-1/4">Disciplina</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 border-b border-gray-200">Semestre</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 border-b border-gray-200">Turno</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 border-b border-gray-200">Sala</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 border-b border-gray-200">Dia</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 border-b border-gray-200">Horário</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-100"></tbody>
            </table>
            <div id="emptyState" class="hidden absolute inset-0 flex flex-col items-center justify-center text-gray-500 bg-white">
                <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p class="text-lg font-medium">Nenhuma sala encontrada.</p>
                <p class="text-sm">Tente ajustar os filtros ou os termos de busca.</p>
            </div>
        </div>
    </div>

        const searchInput = document.getElementById('searchInput');
        const dayFilter = document.getElementById('dayFilter');
        const tableBody = document.getElementById('tableBody');
        const resultCount = document.getElementById('resultCount');
        const emptyState = document.getElementById('emptyState');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');

        function renderRoom(room) {
            if (!room || room === 'nan' || room === 'Em Definição' || room === '-') return `<span class="text-gray-400 italic">A definir</span>`;
            const isLab = room.toLowerCase().includes('lab') || room.toLowerCase().includes('unidade') || room.toLowerCase().includes('infor') || room.toLowerCase().includes('clínica') || room.toLowerCase().includes('clinica') || room.toLowerCase().includes('npj') || room.toLowerCase().includes('spa');
            const bgClass = isLab ? 'bg-purple-100 text-purple-800 border-purple-200' : 'bg-orange-50 text-orange-800 border-orange-200';
            return `<div class="inline-flex items-center px-2.5 py-1 rounded-md border ${bgClass}"><span class="font-bold">${room}</span></div>`;
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50 transition-colors group";
                    row.innerHTML = `
                        <td class="py-2 px-4 border-b border-gray-100 font-medium text-xs text-gray-500 whitespace-nowrap">${item.a}</td>
                        <td class="py-2 px-4 border-b border-gray-100 font-medium text-gray-900 text-sm">${item.c}</td>
                        <td class="py-2 px-4 border-b border-gray-100 text-sm text-gray-700">${item.d}</td>
                        <td class="py-2 px-4 border-b border-gray-100 text-sm text-gray-600">${item.s !== 'nan' ? item.s : '-'}</td>
                        <td class="py-2 px-4 border-b border-gray-100 text-sm font-bold text-gray-600">${item.t !== 'nan' ? item.t : '-'}</td>
                        <td class="py-2 px-4 border-b border-gray-100 whitespace-nowrap">${renderRoom(item.l)}</td>
                        <td class="py-2 px-4 border-b border-gray-100"><span class="inline-block px-2 py-1 bg-gray-100 text-gray-700 text-xs font-medium rounded capitalize">${item.y !== 'nan' ? item.y : '-'}</span></td>
                        <td class="py-2 px-4 border-b border-gray-100 text-sm text-gray-600 whitespace-nowrap">${item.h !== 'nan' ? item.h : '-'}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
            resultCount.textContent = `${data.length} sala(s) encontrada(s)`;
            if (searchInput.value || dayFilter.value) clearFiltersBtn.classList.remove('hidden');
            else clearFiltersBtn.classList.add('hidden');
        }

        function filterData() {
            const searchTerm = searchInput.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const selectedDay = dayFilter.value.toLowerCase();
            const filteredData = scheduleData.filter(item => {
                const cursoNormal = (item.c || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const discNormal = (item.d || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const salaNormal = (item.l || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const abaNormal = (item.a || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                
                const matchesSearch = searchTerm === '' || cursoNormal.includes(searchTerm) || discNormal.includes(searchTerm) || salaNormal.includes(searchTerm) || abaNormal.includes(searchTerm) || `sala ${salaNormal}`.includes(searchTerm);
                const itemDay = (item.y || "").toLowerCase();
                const matchesDay = selectedDay === '' || itemDay.includes(selectedDay);
                return matchesSearch && matchesDay;
            });
            renderTable(filteredData);
        }

        searchInput.addEventListener('input', filterData);
        dayFilter.addEventListener('change', filterData);
        clearFiltersBtn.addEventListener('click', () => { searchInput.value = ''; dayFilter.value = ''; filterData(); });

        function setDefaultDay() {
            const today = new Date().getDay();
            const daysMap = { 1: "seg", 2: "ter", 3: "qua", 4: "qui", 5: "sex" };
            if (daysMap[today] && document.querySelector(`#dayFilter option[value="${daysMap[today].charAt(0).toUpperCase() + daysMap[today].slice(1)}"]`)) {
                dayFilter.value = daysMap[today].charAt(0).toUpperCase() + daysMap[today].slice(1);
            }
        }

        setDefaultDay(); filterData();
