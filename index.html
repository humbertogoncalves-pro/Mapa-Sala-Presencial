<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mapa de Salas — Anhanguera Jundiaí</title>
<meta name="theme-color" content="#d96b1d" />
<style>
:root {
  --bg:#f6f5f3; --card:#ffffff; --ink:#2d2d2d; --muted:#6b7280; --line:#ebe8e3;
  --orange:#d96b1d; --orange2:#b95c16; --gray:#707784; --shadow:0 10px 30px rgba(17,24,39,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#fafaf9 0%,#f5f5f4 100%);color:var(--ink)}
header{background:linear-gradient(135deg,#e47a22 0%, #c55e13 42%, #727b88 100%);color:#fff;padding:24px 16px 28px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.wrap{max-width:1100px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:14px}
.logoMark{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px;font-weight:900;backdrop-filter:blur(6px)}
h1{margin:0;font-size:23px;letter-spacing:-.03em}
.sub{font-size:12px;color:rgba(255,255,255,.9);margin-top:4px}
.anh{font-size:18px;font-weight:900;letter-spacing:.08em;text-align:right;white-space:nowrap}
.searchbox{background:rgba(255,255,255,.16);padding:10px;border-radius:18px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16)}
.searchbox input{width:100%;border:0;outline:none;padding:14px;border-radius:12px;font-size:16px;color:#111827}
main{padding:16px}
.module-switch{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 16px}
.module-btn{border:1px solid var(--line);background:#fff;padding:14px 12px;border-radius:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.module-btn b{display:block;font-size:15px;margin-bottom:4px}
.module-btn span{font-size:12px;color:var(--muted)}
.module-btn.active{background:linear-gradient(135deg,#fff7ed,#f3f4f6);border-color:#fdba74;box-shadow:0 10px 26px rgba(217,107,29,.14)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.legend span{font-size:11px;font-weight:800;padding:7px 10px;border-radius:999px;border:1px solid transparent}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.filters.two{grid-template-columns:repeat(2,1fr)}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:linear-gradient(180deg,#fff,#fafaf9);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;color:var(--orange2)}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
.count{font-weight:800}
.clear{border:0;background:transparent;color:var(--orange2);font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-top:6px solid #d1d5db;border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{font-size:20px;font-weight:900;letter-spacing:-.03em}
.badge{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.subtitle{font-weight:800;margin-top:8px}
.desc{font-size:14px;color:#4b5563;line-height:1.4;margin-top:3px}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.meta div{background:#f3f4f6;border-radius:12px;padding:9px 10px}
.meta span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.meta b{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;background:#fff;border:1px dashed var(--line);border-radius:18px}
footer{text-align:center;padding:28px 10px 40px;color:var(--muted);font-size:11px}
.day-Seg{--day-bg:#dbeafe;--day-ink:#1d4ed8;--day-line:#60a5fa}
.day-Ter{--day-bg:#dcfce7;--day-ink:#15803d;--day-line:#4ade80}
.day-Qua{--day-bg:#ede9fe;--day-ink:#6d28d9;--day-line:#a78bfa}
.day-Qui{--day-bg:#ffedd5;--day-ink:#c2410c;--day-line:#fb923c}
.day-Sex{--day-bg:#fee2e2;--day-ink:#b91c1c;--day-line:#f87171}
.day-Sáb{--day-bg:#ccfbf1;--day-ink:#0f766e;--day-line:#2dd4bf}
.day-Dom{--day-bg:#e5e7eb;--day-ink:#374151;--day-line:#9ca3af}
.day-generic{--day-bg:#eef2ff;--day-ink:#4338ca;--day-line:#818cf8}
.day-chip{background:var(--day-bg);color:var(--day-ink);border-color:var(--day-line)}
.day-card{border-top-color:var(--day-line)}
@media (max-width: 840px) {
  .topbar{flex-direction:column;align-items:stretch}
  .anh{text-align:left}
  .filters,.stats,.grid,.module-switch{grid-template-columns:1fr}
  .filters.two{grid-template-columns:1fr 1fr}
}
</style>
</head>

const DAY_ORDER=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const dayClass=(day)=>{ const d=(day||'').replace('Sab','Sáb'); return DAY_ORDER.includes(d) ? 'day-'+d : 'day-generic'; };

const config={
  'Sala de Aula': {
    filters:[['turno','Todos os turnos'],['dia','Todos os dias'],['curso','Todos os cursos'],['semestre','Todos os semestres']],
    labels:['Salas','Cursos'],
    uniq:(data)=>[new Set(data.map(x=>x.sala).filter(Boolean)).size,new Set(data.map(x=>x.curso).filter(Boolean)).size],
    searchKeys:['codigo','disciplina','curso','semestre','tipo','turno','sala','dia','horario'],
    card:(x)=>`<article class="card ${dayClass(x.dia)} day-card"><div class="top"><div class="title">${esc(x.sala||'—')}</div><div class="badge ${dayClass(x.dia)} day-chip">${esc(x.dia||'Sem dia')}${x.horario?' • '+esc(x.horario):''}</div></div><div class="subtitle">${esc(x.curso||'—')}</div><div class="desc">${esc(x.disciplina||'—')}</div><div class="meta"><div><span>Semestre</span><b>${esc(x.semestre||'—')}</b></div><div><span>Turno</span><b>${esc(x.turno||'—')}</b></div><div><span>Tipo</span><b>${esc(x.tipo||'—')}</b></div><div><span>Cód. Disciplina</span><b>${esc(x.codigo||'—')}</b></div></div></article>`
  },
  'Estágios, TCC, PI': {
    filters:[['turno','Todos os turnos'],['dia','Todos os dias'],['curso','Todos os cursos']],
    labels:['Locais','Cursos'],
    uniq:(data)=>[new Set(data.map(x=>x.local).filter(Boolean)).size,new Set(data.map(x=>x.curso).filter(Boolean)).size],
    searchKeys:['curso','turno','disciplina','diaHorario','dia','horario','local'],
    card:(x)=>`<article class="card ${dayClass(x.dia)} day-card"><div class="top"><div class="title">${esc(x.local||'—')}</div><div class="badge ${dayClass(x.dia)} day-chip">${esc(x.dia||'Sem dia')}${x.horario?' • '+esc(x.horario):''}</div></div><div class="subtitle">${esc(x.curso||'—')}</div><div class="desc">${esc(x.disciplina||'—')}</div><div class="meta"><div><span>Turno</span><b>${esc(x.turno||'—')}</b></div><div><span>Dia e Horário</span><b>${esc(x.diaHorario||'—')}</b></div></div></article>`
  }
};

const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let currentModule='Sala de Aula';

function unique(data,key){
  const vals=[...new Set(data.map(x=>x[key]).filter(Boolean))];
  return vals.sort((a,b)=>{
    if(key==='dia') return DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b);
    return String(a).localeCompare(String(b),'pt-BR',{numeric:true});
  });
}

function renderLegend(){
  $('#legend').innerHTML=DAY_ORDER.map(d=>`<span class="${dayClass(d)} day-chip">${d}</span>`).join('');
}

function renderFilters(){
  const box=$('#filters');
  const defs=config[currentModule].filters;
  box.className='filters '+(defs.length===2?'two':'');
  box.innerHTML=defs.map(([key,label])=>`<select data-key="${key}"><option value="">${label}</option>${unique(datasets[currentModule],key).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`).join('');
  $$('#filters select').forEach(el=>el.addEventListener('change',apply));
}

function apply(){
  const data=datasets[currentModule];
  const defs=config[currentModule];
  const q=norm($('#q').value);
  const filters=Object.fromEntries($$('#filters select').map(el=>[el.dataset.key,el.value]));
  const out=data.filter(x=>{
    const hay=norm(defs.searchKeys.map(k=>x[k]||'').join(' '));
    if(q && !hay.includes(q)) return false;
    for(const [k,v] of Object.entries(filters)){ if(v && String(x[k]||'')!==v) return false; }
    return true;
  });
  const uniq=defs.uniq(out);
  $('#sReg').textContent=out.length;
  $('#sUniq1').textContent=uniq[0];
  $('#sUniq2').textContent=uniq[1];
  $('#lUniq1').textContent=defs.labels[0];
  $('#lUniq2').textContent=defs.labels[1];
  $('#count').textContent=out.length+(out.length===1?' resultado':' resultados');
  const list=$('#list');
  if(!out.length){ list.innerHTML='<div class="empty">Nenhum resultado encontrado neste módulo.</div>'; return; }
  list.innerHTML=out.map(defs.card).join('');
}

$$('.module-btn').forEach(btn=>btn.addEventListener('click',()=>{
  currentModule=btn.dataset.module;
  $$('.module-btn').forEach(b=>b.classList.toggle('active', b===btn));
  $('#q').value='';
  renderFilters();
  apply();
}));
$('#q').addEventListener('input',apply);
$('#clear').addEventListener('click',()=>{ $('#q').value=''; renderFilters(); apply(); });
renderLegend();
renderFilters();
apply();
</script>
